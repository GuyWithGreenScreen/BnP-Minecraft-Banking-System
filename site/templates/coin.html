<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BnP Coin Trader</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        #logo {
            width: 300px;
            max-width: 100%;
            height: auto;
        }
        .header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            margin-left: 15%;
            margin-right: 15%;
        }
        .centerLogo {
            justify-self: center;
        }
        .leftButtons {
            text-align: center;
            justify-self: right;
            padding-right: 15%;
        }
        .rightButtons {
            text-align: center;
            justify-self: left;
            padding-left: 15%;
        }
        #headerButton {
            margin: 0;
            justify-content: center;
        }
        .datContainer {
            display: flex;
            justify-content: center; /* horizontal */
            align-items: center;  
            flex-direction: row;
        }
        .infoContainer {
            margin-right: auto;
            text-align: center;
        }
        .chartContainer {
            margin-right: auto;
            padding-top: 15px;
            margin-left: 25px;
        }
        #itemChart {
            width: 100%;
            height: 600px;
            display: block;
            border-radius: 10px;
            border-style:solid;
            border-color: black;
            background-color: rgb(238, 245, 255);
        }
        .hidden {
            display: none;
        }
        .optionButton {
            font-size: 40px;
            font-weight: bold;
        }
        #error {
            color: rgb(204, 46, 46);
        }
    </style>
    <script src="/static/core/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>
    <script type="module" src="/static/page/coin.js"></script>
</head>
<body>
    <div class="header">
        <div class="leftButtons">
            <p>Analyze The Resource Market</p>
            <a href="resources"><button id="headerButton"><h1>RESOURCES</h1></button></a>
        </div>
        <div class="centerLogo">
            <a href="/"><img id="logo" src="/static/blockAndPaulsBankTransparent.png"></a>
        </div>
        <div class="rightButtons">
            <p>Trade and Make Our FINEST $HIT Coins</p>
            <a href="coins"><button id="headerButton"><h1>COINS</h1></button></a>
        </div>
    </div>
    <p style="background-color: rgb(216, 173, 92); margin: 0; text-align: center;">BnP Coin Trader</p>
    <hr class="seperator" style="margin-top: 0;">
    <div class="datContainer">
        <div class="chartContainer">
            <h1 id="topLabel">$Legon</h1>
            <canvas id="itemChart"></canvas>
        </div>
        <div class="infoContainer">
            <h1 id="coinName">$Legon</h1>
            <p id="coinID">Coin ID: BEEF</p>
            <a id="backingElement"><h2 id="backedBy">Backed By: minecraft:iron_ingot (DEAD)</h2></a>
            <h2 id="globalMinted">Global Minted: 67</h2>
            <hr>
            <h1 id="price">Price: 15 Iron Ingot</h1>
            <hr>
            <h1>Your Balance:</h1>
            <h1 id="userBalance">69</h1>
            <h1  class="hidden" id="resourceBalance">67</h1>
            <a href="login"><button id="loginButton" class="hidden"><h3>LOGIN</h3></button></a>
            <form class="hidden" id="purchaseSellForm">
                <input type="number" id="amount" step="0.001" min="0" required>
                <h3 id="cost">Cost: 34</h3>
                <div id="optionButtons" class="datContainer hidden">
                    <button class="optionButton" id="buyButton">Buy</button>
                    <button class="optionButton" id="sellButton">Sell</button>
                </div>
            </form>
            <h1 class="hidden" id="error">Boii if you dont fish</h1>

        </div>
    </div>
    <br>
    <p style="background-color: rgb(113, 245, 135); margin: 0; text-align: center;">BnP Exchange</p>
</body>
</html>
