<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BnP Coin Trader</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        #logo {
            width: 300px;
            max-width: 100%;
            height: auto;
        }
        .header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            margin-left: 15%;
            margin-right: 15%;
        }
        .centerLogo {
            justify-self: center;
        }
        .leftButtons {
            text-align: center;
            justify-self: right;
            padding-right: 15%;
        }
        .rightButtons {
            text-align: center;
            justify-self: left;
            padding-left: 15%;
        }
        #headerButton {
            margin: 0;
            justify-content: center;
        }
        .gridContainer {
            display: flex;
            justify-content: center; /* horizontal */
            align-items: center;  
            flex-direction: row;
        }
        .infoContainer {
            margin-right: auto;
            text-align: center;
        }
        .chartContainer {
            margin-right: auto;
            padding-top: 15px;
            margin-left: 25px;
        }
        #itemChart {
            width: 100%;
            height: 600px;
            display: block;
            border-radius: 10px;
            border-style:solid;
            border-color: black;
            background-color: rgb(238, 245, 255);
        }
        .hidden {
            display: none;
        }
                .resourcePortfolio,
        .coinPortfolio {
            text-align: center;
        }
        .resource_coin_text {
            font-size: 220%;
        }
        .resourceGrid,
        .coinGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1rem;
            padding: 0 80px;
        }
        .gridItem {
            aspect-ratio: 1 / 1;
            background-image: linear-gradient(rgb(110, 196, 249), rgb(149, 175, 216));
            border-radius: 15px;
            max-width: 260px;
            min-width: 260px;
            min-height: 360px;
            max-height: 360px;
            margin: 15px;
        }
        .coinGridItem {
            aspect-ratio: 1 / 1;
            background-image: linear-gradient(rgb(249, 193, 110), rgb(215, 216, 149));
            border-radius: 15px;
            max-width: 260px;
            min-width: 260px;
            min-height: 360px;
            max-height: 360px;
            margin: 15px;
        }
        .hidden {
            display: none;
        }
        .coinName {
            margin-top: 5px;
            margin-bottom: 0;
        }
        .backingItemID {
            overflow-wrap: anywhere;
            word-break: break-word;
            margin: 0 0;
        }
        .currencyID {
            overflow-wrap: anywhere;
            word-break: break-word;
            margin: 0 0;
        }
        .coinBalance {
            margin: 1% 0;
        }
        .coinChart {
            width: 100%;
            height: 60px;
            display: block;
            border-radius: 50px;
            border-width: 4px;
            border-color: black;
            background-color: beige;
            padding: 14px;
        }
        .nopad {
            margin: 0;
        }
    </style>
    <script src="/static/core/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>
    <script type="module" src="/static/page/coins.js"></script>
</head>
<body>
    <div class="header">
        <div class="leftButtons">
            <p>Analyze The Resource Market</p>
            <a href="resources"><button id="headerButton"><h1>RESOURCES</h1></button></a>
        </div>
        <div class="centerLogo">
            <a href="/"><img id="logo" src="/static/blockAndPaulsBankTransparent.png"></a>
        </div>
        <div class="rightButtons">
            <p>Trade and Make Our FINEST $HIT Coins</p>
            <a href="coins"><button id="headerButton"><h1>COINS</h1></button></a>
        </div>
    </div>
    <p style="background-color: rgb(216, 173, 92); margin: 0; text-align: center;">BnP Coin Trader</p>
    <hr class="seperator" style="margin-top: 0;">
    <div class="coinPortfolio">
        <h1 class="resource_coin_text">COINS</h1>
        <a href="/createcoin"><button id="headerButton"><h1>Create Coin</h1></button></a>
        <div class="coinGrid">
            <div class="coinGridItem hidden">
                <div class="gridInfo">
                    <a class="coinLink" href="coin?id=null"><h1 class="coinName" style="margin-bottom: 0;">$Legon</h1></a>
                    <p class="backingItemID" style="margin: 0 0;">Backed by: minecraft:iron_ingot</p>
                    <p class="coinID" style="margin: 0 0;">ID: BEEF</p>
                    <h3 class="coinPrice" style="margin: 1% 0;">Price: 1235</h3>
                    <canvas class="coinChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
