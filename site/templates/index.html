<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BnP Banking Solutions</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        #logo {
            width: 300px;
            max-width: 100%;
            height: auto;
        }
        .header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            margin-left: 15%;
            margin-right: 15%;
        }
        .centerLogo {
            justify-self: center;
        }
        .leftButtons {
            text-align: center;
            justify-self: right;
            padding-right: 15%;
        }
        .rightButtons {
            text-align: center;
            justify-self: left;
            padding-left: 15%;
        }
        #headerButton {
            margin: 0;
            justify-content: center;
        }
        .seperator {

            color: rgb(175, 99, 0);
        }
        #welcome {
            margin-bottom: 0px;
            color: rgb(59, 59, 59);
            font-style: oblique;
        }
        #username {
            margin-top: 0;
            margin-bottom: 0;
        }
        #userid {
            margin-top: 0;
            color: rgb(22, 22, 22);
            font-style: italic;
        }
        .glanceAccountInfo {
            text-align: center;
        }
        .resourcePortfolio,
        .coinPortfolio {
            text-align: center;
        }
        .resource_coin_text {
            font-size: 220%;
        }
        .resourceGrid,
        .coinGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1rem;
            padding: 0 80px;
        }
        .gridItem {
            aspect-ratio: 1 / 1;
            background-image: linear-gradient(rgb(110, 196, 249), rgb(149, 175, 216));
            border-radius: 15px;
            max-width: 260px;
            min-width: 260px;
            min-height: 360px;
            max-height: 360px;
            margin: 15px;
        }
        .coinGridItem {
            aspect-ratio: 1 / 1;
            background-image: linear-gradient(rgb(249, 193, 110), rgb(215, 216, 149));
            border-radius: 15px;
            max-width: 260px;
            min-width: 260px;
            min-height: 360px;
            max-height: 360px;
            margin: 15px;
        }
        .coinName {
            margin-top: 5px;
            margin-bottom: 0;
        }
        .coinBalance {
            margin: 1% 0;
        }
        .coinChart {
            width: 100%;
            height: 60px;
            display: block;
            border-radius: 50px;
            border-width: 4px;
            border-color: black;
            background-color: beige;
            padding: 14px;
        }
        .hidden {
            display: none;
        }
        .itemName {
            margin-top: 5px;
            margin-bottom: 0;
        }
        .itemID {
            overflow-wrap: anywhere;
            word-break: break-word;
            margin: 0 0;
        }
        .currencyID {
            overflow-wrap: anywhere;
            word-break: break-word;
            margin: 0 0;
        }
        .itemBalance {
            margin: 1% 0;
        }
        .itemChart {
            width: 100%;
            height: 60px;
            display: block;
            border-radius: 50px;
            border-width: 4px;
            border-color: black;
            background-color: beige;
            padding: 14px;
        }
        .backingItemID {
            overflow-wrap: anywhere;
            word-break: break-word;
            margin: 0 0;
        }
        .currencyID {
            overflow-wrap: anywhere;
            word-break: break-word;
            margin: 0 0;
        }
        .nopad {
            margin: 0;
        }
    </style>
    <script src="/static/core/chart.min.js"></script>
    <script type="module" src="/static/page/index.js"></script>

</head>
<body>
    <div class="header">
        <div class="leftButtons">
            <p>Analyze The Resource Market</p>
            <a href="resources"><button id="headerButton"><h1>RESOURCES</h1></button></a>
        </div>
        <div class="centerLogo">
            <img id="logo" src="/static/beenarAndPaulsBank.png">
        </div>
        <div class="rightButtons">
            <p>Trade and Make Our FINEST $HIT Coins</p>
            <a href="coins"><button id="headerButton"><h1>COINS</h1></button></a>
        </div>
    </div>
    <hr class="seperator">
    <div class="glanceAccountInfo">
        <h2 id="welcome">Welcome,</h2>
        <h1 id="username">Loading...</h1>
        <h4 id="userid">USER ID: Loading...</h4>
        <a href="login"><button id="loginButton" class="hidden"><h3>LOGIN</h3></button></a>
    </div>
    <hr>
    <br>
    <div id="portfolio" class="hidden">
        <div class="resourcePortfolio">
            <h1 class="resource_coin_text">RESOURCES</h1>
            <div class="resourceGrid">
                <div class="gridItem">
                    <div class="gridInfo">
                        <h1 class="itemName">IRON INGOT</h1>
                        <p class="itemID">minecraft:iron_ingot</p>
                        <p class="currencyID">BEEF</p>
                        <h3 class="itemBalance nopad">1235</h3>
                        <a class="gridLink" href="/"><h2 class="nopad">Global Item Market:</h2></a>
                        <p class="globalMinted nopad">Global Minted: 34</p>
                        <canvas class="itemChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <hr>
        <div class="coinPortfolio">
            <h1 class="resource_coin_text">COINS</h1>
            <div class="coinGrid">
                <div class="coinGridItem">
                    <div class="gridInfo">
                        <a class="coinLink" href="coin?id=null"><h1 class="coinName" style="margin-bottom: 0;">$Legon</h1></a>
                        <p class="backingItemID" style="margin: 0 0;">Backed by: minecraft:iron_ingot</p>
                        <p class="coinID" style="margin: 0 0;">ID: BEEF</p>
                        <h3 class="coinPrice" style="margin: 1% 0;">Price: 1235</h3>
                        <canvas class="coinChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
